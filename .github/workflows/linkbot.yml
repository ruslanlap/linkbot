name: LinkBot
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: linkbot
  cancel-in-progress: false
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix links and report 404s
        id: scan
        uses: ruslanlap/linkbot@v0.2.0
        continue-on-error: true
        with:
          fix: 'true'
      - name: Refuse scanner errors
        id: gate
        shell: bash
        env:
          SCAN_EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        run: |
          case "$SCAN_EXIT_CODE" in
            0|1) ;;
            *) echo "LinkBot failed: ${SCAN_EXIT_CODE:-no exit code}" >&2; exit 1 ;;
          esac
      - name: Open or update grouped redirect PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: linkbot/permanent-redirects
          delete-branch: true
          title: 'docs: update permanently redirected links'
          commit-message: 'docs: update permanently redirected links'
          body: 'LinkBot updated eligible links. Review all destinations and anchors before merging. See the workflow run for unresolved 404s.'
          add-paths: '**/*.md'
